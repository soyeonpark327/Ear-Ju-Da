<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상담 예약 | 이어주다</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css?v=engagement-2" />
    <link rel="stylesheet" href="../css/pages/home-notes.css?v=engagement-2" />
    <a class="skip" href="#main">본문으로 이동</a>
    <div class="app">
      <header class="page-header">
        <a href="home.html" data-route aria-label="메인으로 돌아가기">〈</a>
        <h1>상담 예약</h1>
      </header>
      <main id="main" class="reservation">
        <p id="load-status" class="status" role="status"></p>
        <div id="booking-content" hidden>
          <section class="booking-expert-panel" aria-label="상담할 베테랑">
            <div id="booking-expert-avatar"></div>
            <div>
              <h2 id="booking-expert-name"></h2>
              <p id="booking-expert-headline"></p>
            </div>
            <button
              id="booking-change-expert"
              type="button"
              class="outline"
              aria-expanded="false"
              aria-controls="booking-expert-picker"
            >
              변경
            </button>
          </section>
          <div id="booking-expert-picker" hidden>
            <label class="expert-label" for="expert-choice"
              >상담할 베테랑을 선택해주세요</label
            >
            <select id="expert-choice"></select>
          </div>
          <div
            id="date-strip"
            class="date-strip"
            role="group"
            aria-label="상담 날짜"
          ></div>
          <h2 id="day-heading">시간을 선택해주세요</h2>
          <p id="slots-status" class="status" role="status"></p>
          <div
            id="booking-times"
            class="booking-times"
            role="group"
            aria-label="상담 시간"
          ></div>
          <div id="modes" class="modes" role="group" aria-label="상담 방식">
            <button
              type="button"
              class="mode"
              id="call-mode"
              aria-pressed="false"
            >
              <span class="mode-icon" aria-hidden="true">☎</span
              ><span
                ><strong>1:1 통화 상담 · 준비 중</strong
                ><small>자료를 공유하고 베테랑의 피드백까지</small></span
              ><b>12,000P</b><span class="recommended">추천</span></button
            ><button
              type="button"
              class="mode"
              id="chat-mode"
              aria-pressed="true"
            >
              <span class="mode-icon" aria-hidden="true">▤</span
              ><span
                ><strong id="chat-label">1:1 채팅 상담</strong
                ><small>채팅으로 편하게 질문</small></span
              ><b id="chat-price"></b>
            </button>
          </div>
          <p id="mode-note" class="mode-note"></p>
          <div class="policies">
            <p>
              <span class="shield" aria-hidden="true">♧</span
              ><span
                >결제한 포인트는 <strong>상담이 끝난 뒤</strong>에 베테랑에게
                전달됩니다. 그 전까지는 플랫폼이 보관합니다.</span
              >
            </p>
            <p>
              <span class="warning" aria-hidden="true">×</span
              ><span
                >취소·환불 가능 여부는 상담 시작 시각과 서비스 정책에 따라
                결정됩니다.</span
              >
            </p>
          </div>
          <footer class="reservation-footer">
            <button id="book" type="button" class="primary full" disabled>
              날짜와 시간을 선택해주세요
            </button>
            <p id="points"></p>
            <p id="booking-message" class="status" role="status"></p>
          </footer>
        </div>
      </main>
    </div>
    <dialog id="notice">
      <h2 id="notice-title">안내</h2>
      <p id="notice-body"></p>
      <form method="dialog"><button class="primary">확인</button></form>
    </dialog>
    <dialog id="booking-confirm">
      <h2>예약 내용을 확인해주세요</h2>
      <p id="confirm-text"></p>
      <label class="topic-label" for="booking-topic">상담 내용</label
      ><textarea
        id="booking-topic"
        maxlength="1000"
        rows="3"
        placeholder="상담하고 싶은 내용을 적어주세요."
      ></textarea>
      <p id="confirm-error" class="status" role="status"></p>
      <div class="confirm-actions">
        <button id="cancel-booking" class="outline">취소</button
        ><button id="confirm-booking" class="primary">예약 확정</button>
      </div>
    </dialog>

    <script type="module" src="../js/pages/mobile-entry.js?v=app-2"></script>
  </body>
</html>
