<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 이어주다</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/pages/home-notes.css" />
    <link rel="stylesheet" href="../css/pages/login.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 이동</a>
    <div class="app">
      <header class="page-header">
        <a href="home.html" id="back" aria-label="메인으로 돌아가기">〈</a>
        <h1 id="page-title">로그인</h1>
      </header>
      <main id="main" class="auth">
        <div class="tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button type="button" role="tab" id="tab-login" aria-selected="true">
            로그인</button
          ><button type="button" role="tab" id="tab-signup" aria-selected="false">
            회원가입
          </button>
        </div>

        <form id="auth-form" novalidate>
          <fieldset id="signup-fields" hidden>
            <legend class="field-label">어떤 분이신가요?</legend>
            <div class="roles">
              <label class="role"
                ><input type="radio" name="role" value="youth" checked /><span
                  ><strong>청년 창업가</strong
                  ><small>베테랑에게 조언을 구해요</small></span
                ></label
              ><label class="role"
                ><input type="radio" name="role" value="veteran" /><span
                  ><strong>베테랑</strong
                  ><small>경험을 나누고 상담해요</small></span
                ></label
              >
            </div>
            <label class="field-label" for="name">이름</label>
            <input id="name" name="name" autocomplete="name" maxlength="30" />
          </fieldset>

          <label class="field-label" for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            required
          />
          <label class="field-label" for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <p id="password-hint" class="hint" hidden>6자 이상 입력해주세요.</p>

          <p id="auth-status" class="status" role="status"></p>
          <button id="submit" type="submit" class="primary full">로그인</button>
        </form>

        <section id="demo-box" class="demo-box" aria-labelledby="demo-title">
          <h2 id="demo-title">데모 계정으로 둘러보기</h2>
          <p>비밀번호는 모두 <strong>demo1234!</strong> 예요.</p>
          <div class="demo-accounts">
            <button type="button" class="outline" data-email="kim@example.com">
              청년 · 김대표
            </button>
            <button type="button" class="outline" data-email="lee@example.com">
              베테랑 · 이정훈
            </button>
            <button type="button" class="outline" data-email="choi@example.com">
              베테랑 · 최동수
            </button>
          </div>
        </section>

        <section id="signed-in" class="signed-in" hidden>
          <p id="signed-in-text"></p>
          <a id="continue" class="primary full" href="home.html">계속하기</a>
          <button id="logout" type="button" class="outline full">로그아웃</button>
        </section>
      </main>
    </div>
    <script type="module" src="../js/pages/login.js"></script>
  </body>
</html>
