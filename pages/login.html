<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 이어주다</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/pages/home-notes.css" />
    <link rel="stylesheet" href="../css/pages/login.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 이동</a>
    <div class="app">
      <header class="page-header">
        <a href="home.html" id="back" aria-label="메인으로 돌아가기">〈</a>
        <h1 id="page-title">로그인</h1>
      </header>
      <main id="main" class="auth">
        <div class="tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button type="button" role="tab" id="tab-login" aria-selected="true">
            로그인</button
          ><button type="button" role="tab" id="tab-signup" aria-selected="false">
            회원가입
          </button>
        </div>

        <form id="auth-form" novalidate>
          <fieldset id="signup-fields" hidden>
            <legend class="field-label">어떤 분이신가요?</legend>
            <div class="roles">
              <label class="role"
                ><input type="radio" name="role" value="youth" checked /><span
                  ><strong>청년 창업가</strong
                  ><small>베테랑에게 조언을 구해요</small></span
                ></label
              ><label class="role"
                ><input type="radio" name="role" value="veteran" /><span
                  ><strong>베테랑</strong
                  ><small>경험을 나누고 상담해요</small></span
                ></label
              >
            </div>
            <label class="field-label" for="name">이름</label>
            <input id="name" name="name" autocomplete="name" maxlength="30" />
          </fieldset>

          <label class="field-label" for="email">이메일 또는 휴대폰 번호</label>
          <input
            id="email"
            name="email"
            type="text"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            placeholder="example@email.com 또는 010-1234-5678"
            required
          />
          <label class="field-label" for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <p id="password-hint" class="hint" hidden>6자 이상 입력해주세요.</p>

          <p id="auth-status" class="status" role="status"></p>
          <button id="submit" type="submit" class="primary full">로그인</button>
        </form>

        <section id="social" class="social" aria-labelledby="social-title">
          <h2 id="social-title" class="divider"><span>간편 로그인</span></h2>
          <div class="social-buttons">
            <button type="button" class="social-btn kakao" data-provider="kakao" data-label="카카오" disabled>
              <svg class="social-logo" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#000" d="M12 3C6.48 3 2 6.48 2 10.78c0 2.78 1.86 5.21 4.66 6.6-.15.52-.97 3.34-1 3.56 0 0-.02.17.09.24.11.06.24.01.24.01.32-.04 3.7-2.42 4.28-2.83.56.08 1.13.12 1.73.12 5.52 0 10-3.48 10-7.78S17.52 3 12 3z" />
              </svg>
              카카오 로그인
            </button>
            <button type="button" class="social-btn naver" data-provider="naver" data-label="네이버" disabled>
              <svg class="social-logo" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#fff" d="M16.27 12.84 7.46 0H0v24h7.73V11.16L16.54 24H24V0h-7.73z" />
              </svg>
              네이버 로그인
            </button>
            <button type="button" class="social-btn google" data-provider="google" data-label="구글" disabled>
              <svg class="social-logo" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
              </svg>
              Google 계정으로 로그인
            </button>
          </div>
          <p id="social-status" class="hint"></p>
        </section>

        <section id="demo-box" class="demo-box" aria-labelledby="demo-title">
          <h2 id="demo-title">데모 계정으로 둘러보기</h2>
          <p>비밀번호는 모두 <strong>demo1234!</strong> 예요.</p>
          <div class="demo-accounts">
            <button type="button" class="outline" data-email="kim@example.com">
              청년 · 김대표
            </button>
            <button type="button" class="outline" data-email="lee@example.com">
              베테랑 · 이정훈
            </button>
            <button type="button" class="outline" data-email="choi@example.com">
              베테랑 · 최동수
            </button>
          </div>
        </section>

        <section id="choose-role" class="choose-role" hidden aria-labelledby="choose-title">
          <h2 id="choose-title">어떤 분이신가요?</h2>
          <p>처음 한 번만 선택하면 돼요. 선택한 뒤에는 바꿀 수 없어요.</p>
          <div class="roles">
            <label class="role"
              ><input type="radio" name="first-role" value="youth" checked /><span
                ><strong>청년 창업가</strong
                ><small>베테랑에게 조언을 구해요</small></span
              ></label
            ><label class="role"
              ><input type="radio" name="first-role" value="veteran" /><span
                ><strong>베테랑</strong
                ><small>경험을 나누고 상담해요</small></span
              ></label
            >
          </div>
          <p id="choose-status" class="status" role="status"></p>
          <button id="choose-submit" type="button" class="primary full">시작하기</button>
        </section>

        <section id="signed-in" class="signed-in" hidden>
          <p id="signed-in-text"></p>
          <a id="continue" class="primary full" href="home.html">계속하기</a>
          <button id="logout" type="button" class="outline full">로그아웃</button>
        </section>
      </main>
    </div>
    <script type="module" src="../js/pages/login.js"></script>
  </body>
</html>
