<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>관리자 | 이어주다</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/pages/home-notes.css?v=2" />
    <link rel="stylesheet" href="../css/pages/admin.css?v=1" />
  </head>
  <body class="adm-page">
    <a class="skip" href="#main">본문으로 이동</a>
    <div class="app">
      <header class="page-header">
        <a href="home.html" data-route aria-label="메인으로 돌아가기">〈</a>
        <h1>관리자</h1>
      </header>
      <main id="main" class="adm-main">
        <p id="adm-status" class="status" role="status"></p>
        <div id="adm-content" hidden>
          <section aria-label="서비스 현황">
            <ul id="adm-stats" class="adm-stats"></ul>
          </section>

          <section aria-labelledby="adm-review-title">
            <h2 id="adm-review-title">베테랑 경력 인증</h2>
            <p class="adm-hint">증명서를 열어 경력(회사·기간·직무)이 프로필과 맞는지 확인한 뒤 승인해 주세요. 반려하면 사유가 베테랑에게 그대로 전달돼요.</p>
            <nav class="adm-tabs" aria-label="인증 상태">
              <button type="button" data-status="pending" aria-pressed="true">승인 대기</button
              ><button type="button" data-status="approved" aria-pressed="false">승인</button
              ><button type="button" data-status="rejected" aria-pressed="false">반려</button
              ><button type="button" data-status="" aria-pressed="false">전체</button>
            </nav>
            <p id="adm-list-status" class="status" role="status"></p>
            <ul id="adm-list" class="adm-list"></ul>
          </section>
        </div>
      </main>
    </div>
    <dialog id="adm-reject" aria-labelledby="adm-reject-title">
      <form id="adm-reject-form">
        <h2 id="adm-reject-title">반려 사유</h2>
        <p id="adm-reject-who"></p>
        <label for="adm-reject-reason" class="adm-label">베테랑에게 보여줄 사유 (300자 이내)</label>
        <textarea id="adm-reject-reason" maxlength="300" rows="4" required placeholder="예) 증명서에 회사명과 근무 기간이 보이지 않아요. 경력증명서 원본을 다시 올려 주세요."></textarea>
        <div class="adm-reasons" id="adm-reasons"></div>
        <div class="adm-confirm-actions">
          <button type="button" id="adm-reject-cancel" class="outline">취소</button
          ><button type="submit" class="primary adm-danger-fill">반려하기</button>
        </div>
      </form>
    </dialog>
    <dialog id="notice">
      <h2 id="notice-title">안내</h2>
      <p id="notice-body"></p>
      <form method="dialog"><button class="primary">확인</button></form>
    </dialog>
    <script type="module" src="../js/pages/admin.js?v=1"></script>
  </body>
</html>
